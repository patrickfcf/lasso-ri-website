name: Problema no site
description: Relate um comportamento incorreto sem dados pessoais.
body:
  - type: textarea
    id: behavior
    attributes:
      label: O que aconteceu e o que você esperava?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Página e passos para reproduzir
      description: Não inclua senhas, dados financeiros ou informações pessoais.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Navegador, dispositivo e idioma
